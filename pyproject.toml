[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-zzzod-adapter"
version = "0.1.1"
description = "Zenless Zone Zero OneDragon adapter for AUTO-MAS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AUTO-MAS Team" }]
keywords = ["auto-mas-plugin", "auto-mas-id:zzzod_adapter"]
dependencies = ["auto-mas-core>=5.9.0b1,<6"]

[project.urls]
Repository = "https://github.com/AUTO-MAS-Project/AUTO-MAS-ZzzOd-Adapter"
Changelog = "https://github.com/AUTO-MAS-Project/AUTO-MAS-ZzzOd-Adapter/blob/HEAD/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zzzod_adapter = ["py.typed", "ui/*", "ui/**/*", "i18n/*.json", "auto_mas_icon.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["zzzod_adapter"]
known-third-party = ["app", "auto_mas_core"]
